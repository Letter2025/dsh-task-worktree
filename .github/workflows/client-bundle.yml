name: Client bundle

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The package migrated from pnpm to npm (0.1.2-rc.1 devDependencies);
      # install exactly the committed lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Build client bundle
        run: npm run build:client

      - name: Verify committed client bundle
        run: git diff --exit-code -- client